<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riftbound Stats Dashboard</title>
  <meta name="description" content="Estadísticas avanzadas y leaderboard de la comunidad de Riftbound en NeatQueue">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="index.css">
  <script src="lang.js"></script>
</head>
<body>
  <div id="errorMessage" data-i18n="error_api" style="background:var(--negative-red);color:#fff;padding:0.75rem;text-align:center;display:none;font-weight:500;position:fixed;top:0;left:0;right:0;z-index:200;">
    Error al conectar con la API. Reintentando...
  </div>

  <header class="topbar">
    <h1 class="topbar__title">⚔️ <span>Riftbound</span> Stats</h1>
    <div class="topbar__search-container">
      <svg class="topbar__search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input class="topbar__search" id="searchInput" data-i18n="search_placeholder" placeholder="Buscar jugador..." autocomplete="off" />
      <div class="topbar__search-results" id="searchResults"></div>
    </div>
    <div style="display: flex; align-items: center; gap: 1rem; margin-left: auto;">
      <div class="refresh-indicator" id="refreshIndicator">
        <span id="lastUpdate">--</span>
      </div>
      <div class="lang-selector">
        <button id="langEs" class="lang-btn active" onclick="setLanguage('es')">🇪🇸</button>
        <button id="langEn" class="lang-btn" onclick="setLanguage('en')">🇬🇧</button>
      </div>
    </div>
  </header>

  <div class="main-content">
    <div class="main-content__left" id="leaderboardPanel">
      <section class="leaderboard">
        <div class="card__header">
          <h2 class="card__title" data-i18n="leaderboard_title">📊 Leaderboard Global</h2>
          <button class="btn btn-outline" id="btnRefresh" data-i18n="btn_refresh">Actualizar</button>
        </div>
        <div class="leaderboard__table-wrapper">
          <table class="leaderboard__table" id="leaderboardTable">
            <thead>
              <tr>
              <th data-i18n="col_rank">#</th>
              <th data-i18n="col_player">JUGADOR</th>
              <th data-i18n="col_mmr">MMR</th>
              <th data-i18n="col_matches">PARTIDAS</th>
              <th data-i18n="col_winrate">WINRATE</th>
              <th data-i18n="col_matches_1300" title="Partidas contra >1300 ELO">P. >1300</th>
              <th data-i18n="col_wr_1300">WR >1300</th>
              <th data-i18n="col_matches_1500" title="Partidas contra >1500 ELO">P. >1500</th>
              <th data-i18n="col_wr_1500">WR >1500</th>
            </tr>
            </thead>
            <tbody id="leaderboardBody">
              <tr><td colspan="9" style="text-align:center;padding:3rem;">Cargando jugadores...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <div class="main-content__right">
      <section class="profile profile--hidden" id="profilePanel">
        <!-- Contenido del perfil renderizado por JS -->
      </section>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
