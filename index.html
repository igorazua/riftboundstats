<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riftbound Stats</title>
  <meta name="description" content="Advanced stats and leaderboard for the Riftbound community on NeatQueue">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div id="errorMessage" style="background:var(--negative-red);color:#fff;padding:0.75rem;text-align:center;display:none;font-weight:500;position:fixed;top:0;left:0;right:0;z-index:200;">
    Error connecting to API. Retrying...
  </div>

  <header class="topbar">
    <h1 class="topbar__title">⚔️ <span>Riftbound</span> Stats</h1>

    <div class="topbar__search-container">
      <svg class="topbar__search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input class="topbar__search" id="searchInput" placeholder="Search player..." autocomplete="off" />
      <div class="topbar__search-results" id="searchResults"></div>
    </div>

    <div class="topbar__actions">
      <div class="refresh-indicator" id="refreshIndicator">
        <span id="lastUpdate">--</span>
      </div>
    </div>
  </header>

  <div class="main-content">
    <div class="main-content__left" id="leaderboardPanel">
      <section class="leaderboard">
        <div class="leaderboard__header">
          <h2 class="leaderboard__title">📊 Global Leaderboard</h2>
          <button class="leaderboard__refresh-btn" id="btnRefresh" title="Refresh">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            <span>Refresh</span>
          </button>
        </div>
        <div class="leaderboard__table-wrapper">
          <table class="leaderboard__table" id="leaderboardTable">
            <thead>
              <tr>
                <th>#</th>
                <th>PLAYER</th>
                <th>MMR</th>
                <th>MATCHES</th>
                <th>WINRATE</th>
                <th title="Matches vs >1300 ELO">M. >1300</th>
                <th>WR >1300</th>
                <th title="Matches vs >1500 ELO">M. >1500</th>
                <th>WR >1500</th>
              </tr>
            </thead>
            <tbody id="leaderboardBody">
              <tr><td colspan="9" style="text-align:center;padding:3rem;">Loading players...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <div class="main-content__right">
      <section class="profile profile--hidden" id="profilePanel">
        <!-- Profile content rendered by JS -->
      </section>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
